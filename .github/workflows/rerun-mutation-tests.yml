name: Rerun mutation tests

# Re-runs PIT against a blocked build's own commit with a different threshold, records a
# fresh mutation-tests attestation against the same artifact, and re-checks the publish gate.
#
# Unlike a waiver, this does not touch the original failing attestation - Kosli judges the
# latest attestation of a given name for compliance (see the "reporting again" behaviour in
# the working notes), so the new one supersedes the old one for gating purposes while both
# stay on the trail as evidence of what actually happened.

on:
  workflow_dispatch:
    inputs:
      trail:
        description: "Trail name (the git commit SHA of the blocked build)"
        type: string
        required: true
      fingerprint:
        description: "Artifact fingerprint (printed by the build-and-attest job)"
        type: string
        required: true
      mutation_threshold:
        description: "Mutation score threshold, in percent"
        type: string
        default: "70"

permissions:
  contents: read

env:
  KOSLI_ORG: kosli-public
  KOSLI_FLOW: order-system-ci
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}

jobs:
  rerun:
    runs-on: ubuntu-latest
    environment: mutation-rerun # optional: add required reviewers here to make this a two-person job
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.trail }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      - name: Run mutation testing
        run: mvn -B --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Attest the mutation testing results
        run: |
          python3 scripts/mutation_attestation.py \
            --report target/pit-reports/mutations.xml \
            --threshold "${{ inputs.mutation_threshold }}" \
            --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out mutation-testing.json
          kosli attest custom \
            --name mutation-tests \
            --type mutation-testing \
            --fingerprint "${{ inputs.fingerprint }}" \
            --attestation-data mutation-testing.json \
            --attachments target/pit-reports

      # No --policy: same assert the publish-gate job itself runs, against the flow template.
      - name: Re-check the publish gate
        run: |
          kosli assert artifact \
            --fingerprint "${{ inputs.fingerprint }}" \
            --flow "$KOSLI_FLOW"
