name: Snapshot the Azure environments

# Reports what is actually running in both App Service environments to their Kosli
# environments.
#
# Called, never triggered on its own:
#   * report-azure-environment.yml calls it on a schedule
#   * ci-build.yml calls it right after each deploy, so the trail reads in the order things
#     happened - running in staging, then the integration tests, then the approval, then
#     running in production - rather than whenever the schedule next fires
#
# It reports both environments every time, including the one that cannot have changed: a
# snapshot of an unchanged environment reports the same state again, so there is nothing to
# gain from telling it which deploy it is following, and no resource-group input to get wrong.
#
# It is a reusable workflow rather than a dispatched one on purpose: `needs:` on a
# `workflow_call` job is synchronous, so the caller knows the snapshot landed before it moves
# on, which `gh workflow run` cannot promise. It also keeps AZURE_CLIENT_SECRET out of the
# deploy jobs - `kosli snapshot azure` calls the Azure management API directly and has no OIDC
# path, so a client secret is unavoidable somewhere.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # `kosli snapshot azure` snapshots a whole resource group and cannot filter by app, which is
  # why each environment has its own resource group - one leg, one Kosli environment.
  snapshot:
    name: ${{ matrix.kosli-environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kosli-environment: ${{ vars.KOSLI_ENVIRONMENT || 'azure-appservice-prod' }}
            resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          - kosli-environment: ${{ vars.KOSLI_ENVIRONMENT_STAGING || 'azure-appservice-staging' }}
            resource-group: ${{ vars.AZURE_RESOURCE_GROUP_STAGING }}
    env:
      KOSLI_ORG: kosli-public
      KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
    steps:
      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      - name: Snapshot the App Service environment
        run: |
          kosli snapshot azure "${{ matrix.kosli-environment }}" \
            --azure-client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --azure-client-secret "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --azure-tenant-id "${{ secrets.AZURE_TENANT_ID }}" \
            --azure-subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --azure-resource-group-name "${{ matrix.resource-group }}" \
            --digests-source logs --debug
