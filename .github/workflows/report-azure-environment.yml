name: Report Azure environment

# The periodic sweep: reports what is running in both App Service environments to Kosli, so
# Kosli can compare running software against what the pipeline approved even when nothing is
# being deployed. The pipeline reports its own snapshots straight after each deploy, by calling
# the same reusable workflow.
#
# Optional: the schedule only runs when the repository variable REPORT_AZURE_ENV is set to
# 'true', which is how the periodic reporting is turned off. That guard is deliberately not on
# the pipeline's own snapshot jobs - those are part of the release story, not the sweep.

on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ vars.REPORT_AZURE_ENV == 'true' }}
    name: Snapshot
    uses: ./.github/workflows/snapshot-azure-environment.yml
    secrets: inherit
