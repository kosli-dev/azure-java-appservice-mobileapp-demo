name: Release

# The release process for the whole order system. Three steps, two of them manual:
#
#   1. push a tag (v0.0.1)  -> release-build reports the release to Kosli
#   2. run "Report integration test result" for that tag, choosing pass or fail
#   3. approve the release-gate job ("continue") -> Kosli decides whether it may go out
#
# Step 3 is not the decision: the approval only lets the gate job run, and the job asks
# Kosli. A human can start the gate; a human cannot talk it into passing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  KOSLI_ORG: kosli-public
  KOSLI_FLOW: order-system-release
  # The trail is the tag, so the manually-run integration test workflow can find it.
  KOSLI_TRAIL: ${{ github.ref_name }}
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
  KOSLI_DRY_RUN: ${{ vars.KOSLI_DRY_RUN }}

jobs:
  release-build:
    name: Build the release and report it
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.backend.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      # ------------------------------------------------------------- Kosli flow + trail
      - name: Create or update the Kosli flow
        run: |
          kosli create flow "$KOSLI_FLOW" \
            --template-file kosli/flow-templates/order-system-release.yml \
            --description "Releases of the order system: the Java backend and the mobile apps, released together"

      - name: Begin the Kosli trail for this release
        run: |
          kosli begin trail "$KOSLI_TRAIL" \
            --description "Release $KOSLI_TRAIL - $(git log -1 --pretty=%s)"

      # ------------------------------------------------------------- The release contents
      # Each component is rebuilt from the tagged commit rather than pulled from the CI
      # runs, so the release trail has provenance of its own for everything it contains.
      - name: Build the backend
        run: |
          mvn -B --no-transfer-progress verify
          mkdir -p deploy
          # App Service's Java SE container runs /home/site/wwwroot/app.jar
          cp target/orders-api.jar deploy/app.jar

      - name: Attest the backend
        id: backend
        run: |
          kosli fingerprint deploy --artifact-type dir --debug
          FINGERPRINT="$(kosli fingerprint deploy --artifact-type dir)"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          kosli attest artifact deploy \
            --artifact-type dir \
            --name orders-api

      - name: Build the mobile apps
        run: |
          make package PLATFORM=android
          make package PLATFORM=ios

      - name: Attest the mobile apps
        run: |
          for platform in android ios; do
            kosli attest artifact "build/mobileorders-${platform}.zip" \
              --artifact-type file \
              --name "mobileorders-${platform}"
          done

      # Re-scanned rather than inheriting the component pipeline's SARIF, which describes a
      # different fingerprint: these zips are release rebuilds.
      - name: Scan the mobile apps
        run: |
          make scan PLATFORM=android
          make scan PLATFORM=ios

      - name: Attest the mobile scans
        run: |
          for platform in android ios; do
            kosli attest custom "build/mobileorders-${platform}.zip" \
              --artifact-type file \
              --name mobile-sast \
              --type mobile-sast \
              --attestation-data "build/mobsfscan-${platform}.sarif" \
              --attachments "build/mobsfscan-${platform}.sarif"
          done

      - name: Upload the deployable
        uses: actions/upload-artifact@v7
        with:
          name: order-system-release-jar
          path: deploy/app.jar
          if-no-files-found: error

      - name: What happens next
        run: |
          {
            echo "### Release $KOSLI_TRAIL reported to Kosli"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trail | [\`$KOSLI_TRAIL\`](https://app.kosli.com/$KOSLI_ORG/flows/$KOSLI_FLOW/trails/$KOSLI_TRAIL) |"
            echo "| Backend fingerprint | \`${{ steps.backend.outputs.fingerprint }}\` |"
            echo ""
            echo "The release is now waiting for approval on the **release-gate** job, and the"
            echo "trail is not compliant yet: nothing has reported an integration test run."
            echo ""
            echo "1. Run the **Report integration test result** workflow with tag \`$KOSLI_TRAIL\`,"
            echo "   choosing \`pass\` or \`fail\`."
            echo "2. Approve **release-gate** below. Kosli decides from there."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------- The gate
  release-gate:
    name: May this release go out?
    runs-on: ubuntu-latest
    needs: release-build
    # Without required reviewers on this environment the job does not wait, and there is
    # no approval to attest below.
    environment: production-release
    # actions: read is for the approvals API, which is how the approver is identified.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      - name: Who approved this release?
        id: approver
        uses: ./.github/actions/get-github-workflow-approver
        with:
          environment-name: production-release

      # Before the assert below: the flow template requires this attestation.
      - name: Attest the approval
        run: |
          kosli attest custom \
            --name release-approval \
            --type approval-github-workflow \
            --attestation-data "${{ steps.approver.outputs.approval-json-file }}" \
            --attachments "${{ steps.approver.outputs.approval-json-file }}"
          echo "Approved by ${{ steps.approver.outputs.approver }}" >> "$GITHUB_STEP_SUMMARY"

      # The policy is kosli/policies/release-gate.yml, created by the "Bootstrap Kosli"
      # workflow. A missing or failing integration test blocks here.
      - name: Assert the release-gate policy
        run: |
          kosli assert artifact \
            --fingerprint "${{ needs.release-build.outputs.fingerprint }}" \
            --policy release-gate \
            --flow "$KOSLI_FLOW"

      - name: Explain how to unblock
        if: failure()
        run: |
          cat <<EOF
          ==========================================================================
          The release gate blocked release ${KOSLI_TRAIL}.

          Trail:  https://app.kosli.com/${KOSLI_ORG}/flows/${KOSLI_FLOW}/trails/${KOSLI_TRAIL}
          Policy: kosli/policies/release-gate.yml

          The usual cause in this demo is the integration test run: either it was never
          reported to this trail, or it was reported as a failing run. The approval itself
          was recorded a step earlier, as ${{ steps.approver.outputs.approver }}.

          Run the "Report integration test result" workflow with:

            tag:    ${KOSLI_TRAIL}
            result: pass

          ...then re-run this job. Reporting again adds another attestation to the trail;
          Kosli judges the latest one.
          ==========================================================================
          EOF

  # The published release is the record of what was approved; deploying consumes it.
  publish-release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: [release-build, release-gate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: order-system-release-jar
          path: deploy

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$KOSLI_TRAIL" \
            --title "$KOSLI_TRAIL" \
            --generate-notes \
            deploy/app.jar

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [release-build, publish-release]
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      # The same build the gate approved, byte for byte - not a rebuild.
      - uses: actions/download-artifact@v7
        with:
          name: order-system-release-jar
          path: deploy

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deploy

      - name: Smoke test
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL"; then
              echo
              echo "release $KOSLI_TRAIL is up"
              exit 0
            fi
            echo "waiting for the app to start (attempt $attempt)..."
            sleep 10
          done
          echo "app did not become healthy" >&2
          exit 1

      - name: Where it landed
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`$KOSLI_TRAIL\` |"
            echo "| Backend fingerprint | \`${{ needs.release-build.outputs.fingerprint }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.webapp-url }} |"
            echo ""
            echo "The next Azure environment snapshot should show this fingerprint running."
          } >> "$GITHUB_STEP_SUMMARY"
