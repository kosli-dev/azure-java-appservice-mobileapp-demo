name: PR checks

# Fast feedback on the pull request itself. Nothing is attested here: the Kosli trail for
# this change is created from the merge commit on main, which is also the commit the
# pull-request and peer-review attestations are about.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, test, mutation test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Mutation testing
        run: mvn -B --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Mutation score
        run: |
          python3 scripts/mutation_attestation.py \
            --report target/pit-reports/mutations.xml \
            --threshold "${{ vars.MUTATION_THRESHOLD || '85' }}" \
            --out mutation-testing.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: target/pit-reports
          if-no-files-found: warn
