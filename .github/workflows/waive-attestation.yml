name: Waive an attestation

# Waives (overrides) a non-compliant attestation on a trail, with a reason that is recorded
# in Kosli forever. This is the workflow-driven equivalent of clicking "Override" on the
# attestation in the Kosli UI - handy in a demo where you would rather not switch to a
# terminal, and a realistic pattern for teams that want waivers to leave an audit trail in
# GitHub as well as in Kosli.
#
# The mutation-testing control is the one that fails by design in this demo, so its values
# are the defaults below.

on:
  workflow_dispatch:
    inputs:
      trail:
        description: "Trail name (the git commit SHA of the blocked build)"
        type: string
        required: true
      fingerprint:
        description: "Artifact fingerprint (printed by the build-and-attest job)"
        type: string
        required: true
      reason:
        description: "Why is this acceptable, and what happens next?"
        type: string
        required: true
      attestation:
        description: "Attestation name from the flow template"
        type: string
        default: mutation-tests
      attestation_type:
        description: "Type of the attestation being waived"
        type: string
        default: custom:mutation-testing

permissions:
  contents: read

env:
  KOSLI_ORG: kosli-public
  KOSLI_FLOW: orders-api-ci
  KOSLI_PUBLIC_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}

jobs:
  waive:
    runs-on: ubuntu-latest
    environment: waivers # optional: add required reviewers here to make waivers a two-person job
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      - name: Record the waiver
        env:
          WAIVED_BY: ${{ github.actor }}
        run: |
          ./scripts/waive_attestation.sh \
            --trail "${{ inputs.trail }}" \
            --fingerprint "${{ inputs.fingerprint }}" \
            --attestation "${{ inputs.attestation }}" \
            --type "${{ inputs.attestation_type }}" \
            --artifact orders-api \
            --reason "${{ inputs.reason }} (waived by ${{ github.actor }} via ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Re-check the publish gate
        run: |
          kosli assert artifact \
            --fingerprint "${{ inputs.fingerprint }}" \
            --policy publish-gate
