name: CI build

# The pipeline for the whole order system: the Java backend and both mobile apps, built,
# controlled and released together from one commit on main.
#
#   trail                      create the flow and the trail for this commit
#   backend                    build, test and attest the Java service     \ in parallel
#   mobile                     package, scan and attest each mobile app    /
#   publish-gate               may this component be released to staging?
#   deploy-staging             put it on the staging App Service
#   snapshot-after-staging     report what is now running in both environments
#   report-integration-tests   ask for the integration test run to be reported
#   release-gate               wait for approval, then ask Kosli whether the release may go out
#   deploy                     put the approved build on the production App Service
#   snapshot-after-production  report both environments again
#
# The two snapshot jobs are what make the trail read in the order things happened, rather
# than whenever the 15-minute schedule in report-azure-environment.yml next fires.
#
# deploy-staging auto-triggers "Report integration test result" for this commit, reporting
# whichever result INTEGRATION_TEST_DEFAULT_RESULT names (default: pass). Run that workflow by
# hand - before or after - to force pass or fail instead, e.g. to demo the gate blocking.
#
# One step stays manual, and it is not the decision: approving the release-gate job
# ("continue"). The approval only lets the gate job run, and the job asks Kosli. A human can
# start the gate; a human cannot talk it into passing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mutation_threshold:
        description: "Mutation score threshold, in percent"
        type: string
        default: "85"

permissions:
  contents: read
  pull-requests: read

env:
  KOSLI_ORG: kosli-public
  KOSLI_FLOW: order-system-ci
  # The trail is the commit, so the manually-run integration test workflow can find it.
  KOSLI_TRAIL: ${{ github.sha }}
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
  KOSLI_DRY_RUN: ${{ vars.KOSLI_DRY_RUN }}
  ARTIFACT_NAME: orders-api
  MUTATION_THRESHOLD: ${{ github.event.inputs.mutation_threshold || vars.MUTATION_THRESHOLD || '85' }}

jobs:
  # The trail has to exist before anything attests to it, and this is the only job that
  # creates it, so the build jobs below cannot race each other creating the same trail.
  trail:
    name: Begin the trail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      # The flow template is version-controlled with the code
      # (kosli/flow-templates/order-system-ci.yml), so the system's definition of "done"
      # changes through pull requests like anything else.
      - name: Create or update the Kosli flow
        run: |
          kosli create flow "$KOSLI_FLOW" \
            --template-file kosli/flow-templates/order-system-ci.yml \
            --description "The order system: Java backend on Azure App Service, plus the Mobile Orders apps"

      - name: Begin the Kosli trail for this commit
        run: |
          kosli begin trail "$KOSLI_TRAIL" \
            --description "$(git log -1 --pretty=%s)"

      - name: Attest the pull request
        run: |
          kosli attest pullrequest github \
            --name pull-request \
            --github-token "${{ secrets.GITHUB_TOKEN }}"

      - name: What happens next
        run: |
          {
            echo "### Next"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trail | [\`$KOSLI_TRAIL\`](https://app.kosli.com/$KOSLI_ORG/flows/$KOSLI_FLOW/trails/$KOSLI_TRAIL) |"
            echo ""
            echo "The trail is not compliant yet: nothing has reported an integration test run."
            echo ""
            echo "1. deploy-staging auto-triggers **Report integration test result** with commit"
            echo "   \`$KOSLI_TRAIL\`, reporting the INTEGRATION_TEST_DEFAULT_RESULT variable's"
            echo "   result. Run that workflow by hand to force \`pass\` or \`fail\` instead."
            echo "2. Approve **release-gate** below. Kosli decides from there."
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Build and attest the backend
    runs-on: ubuntu-latest
    needs: trail
    outputs:
      orders-api-fingerprint: ${{ steps.artifact.outputs.orders-api-fingerprint }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      # ---------------------------------------------------------------- Build and unit test
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Stage the deployable
        run: |
          mkdir -p deploy
          # App Service's Java SE container runs /home/site/wwwroot/app.jar
          cp target/orders-api.jar deploy/app.jar
          # The JAR is reproducible (project.build.outputTimestamp in the POM), so two commits
          # with identical compiled output fingerprint the same and become one artifact in
          # Kosli. This makes every build its own artifact.
          date -u +%Y-%m-%dT%H:%M:%SZ > deploy/build-time.txt
          cat deploy/build-time.txt

      # ------------------------------------------------------------- Artifact + provenance
      - name: Attest the backend
        id: artifact
        run: |
          ORDERS_API_FINGERPRINT="$(kosli fingerprint deploy --artifact-type dir)"
          echo "orders-api-fingerprint=$ORDERS_API_FINGERPRINT" >> "$GITHUB_OUTPUT"
          # Every later orders-api attestation binds to it via KOSLI_FINGERPRINT.
          echo "KOSLI_FINGERPRINT=$ORDERS_API_FINGERPRINT" >> "$GITHUB_ENV"
          kosli attest artifact deploy \
            --artifact-type dir \
            --name "$ARTIFACT_NAME"
          {
            echo "### Kosli"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | \`$ARTIFACT_NAME\` |"
            echo "| Fingerprint | \`$ORDERS_API_FINGERPRINT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the backend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: deploy/app.jar
          format: cyclonedx-json
          output-file: sbom-orders-api.cdx.json
          upload-artifact: false

      - name: Attest the backend SBOM
        run: |
          kosli attest custom \
            --fingerprint "$KOSLI_FINGERPRINT" \
            --name sbom \
            --type cyclonedx-sbom \
            --attestation-data sbom-orders-api.cdx.json \
            --attachments sbom-orders-api.cdx.json

      # -------------------------------------------------------------------- 1. Peer review
      # The `pull-request` attestation (trail job) already gathered everything a peer review
      # needs to judge - who approved, who wrote the code - so there is no separate GitHub API
      # call here: just read that attestation back.
      - name: Fetch the pull request attestation
        # KOSLI_FINGERPRINT (set above, for the artifact) and --trail are mutually exclusive
        # on `get attestation` - the CLI binds --fingerprint from that env var even though
        # this call never passes the flag itself, so it has to be cleared for this step.
        env:
          KOSLI_FINGERPRINT: ""
        run: |
          kosli get attestation pull-request \
            --flow "$KOSLI_FLOW" \
            --trail "$KOSLI_TRAIL" \
            --output json | jq '.[0]' > pull-request.json

      # The facts never reach Kosli as a second attestation - kosli/policies/peer-review.rego
      # judges pull-request.json directly, and the verdict is recorded as a decision against
      # the `peer-review` control. peer-review-decision is in the flow template
      # (order-system-ci.yml), so a bad peer review fails trail-compliance - and so
      # publish-gate - as soon as this job finishes, same as unit-tests or mutation-tests.
      - name: Evaluate and record the peer review control decision
        run: |
          VERDICT="$(kosli evaluate input \
            --input-file pull-request.json \
            --policy kosli/policies/peer-review.rego \
            --no-assert \
            --output json)"
          COMPLIANT="$(echo "$VERDICT" | jq -r '.allow')"
          echo "$VERDICT" | jq -r '.violations[]? | "peer review: " + .'
          # Plain name + explicit --fingerprint, not the dotted artifact.attestation form: the
          # fingerprint is already known (KOSLI_FINGERPRINT, set when the artifact was
          # attested above), so there is nothing for name-based template addressing to resolve
          # that the fingerprint doesn't already say more directly.
          kosli attest decision \
            --name peer-review-decision \
            --fingerprint "$KOSLI_FINGERPRINT" \
            --control peer-review \
            --compliant="$COMPLIANT" \
            --attachments pull-request.json \
            --attachments kosli/policies/peer-review.rego

      - name: Attest the unit tests
        run: |
          kosli attest junit \
            --name "$ARTIFACT_NAME.unit-tests" \
            --results-dir target/surefire-reports

      # ------------------------------------------------------------ 2. SonarQube quality gate
      # No `kosli attest` call here: the org's Sonar integration (Kosli Docs > Integrations >
      # Sonar) has a webhook configured on the SonarCloud project, so SonarCloud attests the
      # quality gate result straight to this trail once the scan below completes. The
      # sonar.analysis.kosli_* args are what tell it which flow/trail/artifact to attest to.
      - name: Run the SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.analysis.kosli_flow=${{ env.KOSLI_FLOW }}
            -Dsonar.analysis.kosli_trail=${{ env.KOSLI_TRAIL }}
            -Dsonar.analysis.kosli_attestation=sonar-quality-gate
            -Dsonar.analysis.kosli_git_commit=${{ github.sha }}
            -Dsonar.analysis.kosli_artifact_fingerprint=${{ env.KOSLI_FINGERPRINT }}

      # ----------------------------------------------------------------- 3. Mutation testing
      - name: Run mutation testing
        run: mvn -B --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Attest the mutation testing results
        run: |
          python3 scripts/mutation_attestation.py \
            --report target/pit-reports/mutations.xml \
            --threshold "$MUTATION_THRESHOLD" \
            --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out mutation-testing.json
          kosli attest custom \
            --name "$ARTIFACT_NAME.mutation-tests" \
            --type mutation-testing \
            --attestation-data mutation-testing.json \
            --attachments target/pit-reports

      - name: Upload the deployable
        uses: actions/upload-artifact@v7
        with:
          name: orders-api-jar
          # The whole directory, because it is the directory that was fingerprinted: the
          # deploy jobs check out only to reach the local composite action and get everything
          # they deploy from this artifact, and what they deploy has to match what was
          # attested file for file - `kosli snapshot azure` unzips wwwroot and fingerprints it
          # the same way.
          path: deploy
          # Dotfiles are excluded by default, which silently drops .kosli_ignore.
          include-hidden-files: true
          if-no-files-found: error

  # ------------------------------------------------------------------- 4. The mobile apps
  mobile:
    name: Build and attest ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: trail
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    env:
      ARTIFACT: build/mobileorders-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      - name: Build
        run: make package PLATFORM=${{ matrix.platform }}

      - name: Attest the app
        id: artifact
        run: |
          FINGERPRINT="$(kosli fingerprint "$ARTIFACT" --artifact-type file)"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          kosli attest artifact "$ARTIFACT" \
            --artifact-type file \
            --name "mobileorders-${{ matrix.platform }}"

      # The Oversecured report is a canned one from the customer, the same for both
      # platforms. Only the header is attested: the full report is far too large for
      # attestation data, so it goes to the Evidence Vault as an attachment.
      - name: Attest the Oversecured report
        run: |
          python3 scripts/oversecured_attestation.py \
            --report oversecured/report-pass.json \
            --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out oversecured.json
          kosli attest custom \
            --fingerprint "$(kosli fingerprint "$ARTIFACT" --artifact-type file)" \
            --name oversecured \
            --type oversecured \
            --attestation-data oversecured.json \
            --attachments oversecured/report-pass.json

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.ARTIFACT }}
          format: cyclonedx-json
          output-file: sbom-mobileorders-${{ matrix.platform }}.cdx.json
          upload-artifact: false

      - name: Attest the SBOM
        run: |
          kosli attest custom \
            --fingerprint "${{ steps.artifact.outputs.fingerprint }}" \
            --name sbom \
            --type cyclonedx-sbom \
            --attestation-data sbom-mobileorders-${{ matrix.platform }}.cdx.json \
            --attachments sbom-mobileorders-${{ matrix.platform }}.cdx.json

  # ------------------------------------------------------------------------- 5. Publish gate
  publish-gate:
    name: Can release to staging?
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      # No --policy: with neither --policy nor --environment, the artifact is asserted
      # against its flow template, which is everything the build owed. Policies are the
      # release gate's business.
      - name: Assert the flow template
        run: |
          kosli assert artifact \
            --fingerprint "${{ needs.backend.outputs.orders-api-fingerprint }}" \
            --flow "$KOSLI_FLOW"

      - name: Explain how to unblock
        if: failure()
        run: |
          MESSAGE=$(cat <<EOF
          ==========================================================================
          The publish gate blocked this component.

          Trail:    https://app.kosli.com/${KOSLI_ORG}/flows/${KOSLI_FLOW}/trails/${KOSLI_TRAIL}
          Template: kosli/flow-templates/order-system-ci.yml

          Fix the failing control. If it's the mutation score, you can re-run PIT with a
          different threshold instead of pushing a new commit, from the Actions tab with the
          "Rerun mutation tests" workflow:

            trail:               ${KOSLI_TRAIL}
            fingerprint:         ${{ needs.backend.outputs.orders-api-fingerprint }}
            mutation_threshold:  a value the current score clears

          ...then re-run this job. The Sonar attestation arrives by webhook, so it can also
          simply not have landed yet.
          ==========================================================================
          EOF
          )
          echo "$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- 6. Deploy to staging
  # Gated by publish-gate only: staging is where the build goes once Kosli says it owes
  # nothing, and before anyone is asked to approve production.
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [backend, publish-gate]
    permissions:
      contents: read
      id-token: write
      # For triggering the "Report integration test result" workflow below.
      actions: write
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy-appservice
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_STAGING }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Where it landed
        run: |
          {
            echo "### Deployed to staging"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$KOSLI_TRAIL\` |"
            echo "| Backend fingerprint | \`${{ needs.backend.outputs.orders-api-fingerprint }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.webapp-url }} |"
            echo ""
            echo "Integration tests run against this before the production gate is approved."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------- 7. Report the environments, again
  # Before the integration test result and the approval, not on the next turn of the schedule,
  # so the artifact's history reads in the order things actually happened: built and attested,
  # running in staging, tested, approved, running in production. Both environments are
  # reported, since re-reporting the one that cannot have changed costs nothing. A reusable
  # workflow rather than `gh workflow run`, because `needs:` on it is synchronous - see
  # snapshot-azure-environment.yml.
  snapshot-after-staging:
    name: Report the environments (after staging)
    needs: deploy-staging
    uses: ./.github/workflows/snapshot-azure-environment.yml
    secrets: inherit

  # ------------------------------------------------------- 8. Report the integration test run
  report-integration-tests:
    name: Report the integration test run
    runs-on: ubuntu-latest
    needs: snapshot-after-staging
    permissions:
      contents: read
      actions: write
    steps:
      # Fire-and-forget: leaves `result` on its "default" choice, which
      # report-integration-test-result.yml resolves from the INTEGRATION_TEST_DEFAULT_RESULT
      # repo variable. Run that workflow by hand afterwards to force pass/fail instead.
      - name: Trigger the integration test report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run report-integration-test-result.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            -f commit="$KOSLI_TRAIL"

  # ------------------------------------------------------------------------ 9. Release gate
  release-gate:
    name: Can release to Production?
    runs-on: ubuntu-latest
    needs: [backend, mobile, publish-gate, report-integration-tests]
    # Without required reviewers on this environment the job does not wait, and there is
    # no approval to attest below.
    environment: production-release
    # actions: read is for the approvals API, which is how the approver is identified.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      - name: Who approved this release?
        id: approver
        uses: ./.github/actions/get-github-workflow-approver
        with:
          environment-name: production-release

      # Bound to the artifact, not the trail: production-readiness.yml matches it as an
      # attestation on the artifact being asserted.
      - name: Attest the approval
        run: |
          kosli attest custom \
            --fingerprint "${{ needs.backend.outputs.orders-api-fingerprint }}" \
            --name release-approval \
            --type approval-github-workflow \
            --attestation-data "${{ steps.approver.outputs.approval-json-file }}" \
            --attachments "${{ steps.approver.outputs.approval-json-file }}"
          echo "Approved by ${{ steps.approver.outputs.approver }}" >> "$GITHUB_STEP_SUMMARY"

      # An environment with no policies attached makes the assert below pass vacuously -
      # verified against kosli-public: `assert artifact --environment` on an environment with
      # an empty policy list prints COMPLIANT and exits 0. A gate that cannot fail is worse
      # than no gate, so refuse to run rather than wave the release through.
      - name: Check the environment has policies attached
        env:
          KOSLI_ENV: ${{ vars.KOSLI_ENVIRONMENT || 'azure-appservice-prod' }}
        run: |
          attached=$(kosli get environment "$KOSLI_ENV" --output json | jq '.policies // [] | length')
          echo "$KOSLI_ENV has $attached policies attached"
          if [ "$attached" -eq 0 ]; then
            echo "::error::No policies attached to $KOSLI_ENV - the release gate would pass"\
                 " no matter what. Run the Bootstrap Kosli workflow with 'create environment'."
            exit 1
          fi

      # Asserted against the *environment*, not against a policy of the gate's own: with
      # --environment, Kosli judges the artifact by every policy attached to that environment
      # - secure-development and production-readiness. So the question this gate asks is
      # exactly "would this artifact be allowed to run in production?", and there is one
      # definition of that, enforced here before the deploy and continuously afterwards by the
      # environment snapshots. Between them the two policies require provenance, a compliant
      # trail and the release controls, so a missing or failing integration test blocks here -
      # as does an unscanned mobile app or a still-failing backend control.
      - name: Assert the production environment's policies
        run: |
          kosli assert artifact \
            --fingerprint "${{ needs.backend.outputs.orders-api-fingerprint }}" \
            --environment "${{ vars.KOSLI_ENVIRONMENT || 'azure-appservice-prod' }}" \
            --flow "$KOSLI_FLOW"

      - name: Explain how to unblock
        if: failure()
        run: |
          MESSAGE=$(cat <<EOF
          ==========================================================================
          The release gate blocked ${KOSLI_TRAIL}.

          Trail:    https://app.kosli.com/${KOSLI_ORG}/flows/${KOSLI_FLOW}/trails/${KOSLI_TRAIL}
          Policies: whatever is attached to ${{ vars.KOSLI_ENVIRONMENT || 'azure-appservice-prod' }} -
                    kosli/policies/secure-development.yml and
                    kosli/policies/production-readiness.yml

          The usual cause in this demo is the integration test run: either it was never
          reported to this trail, or it was reported as a failing run. The approval itself
          was recorded a step earlier, as ${{ steps.approver.outputs.approver }}.

          Run the "Report integration test result" workflow with:

            commit: ${KOSLI_TRAIL}
            result: pass

          ...then re-run this job. Reporting again adds another attestation to the trail;
          Kosli judges the latest one.
          ==========================================================================
          EOF
          )
          echo "$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------- 10. Deploy to production
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [backend, release-gate]
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy
        id: deploy
        uses: ./.github/actions/deploy-appservice
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Where it landed
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$KOSLI_TRAIL\` |"
            echo "| Backend fingerprint | \`${{ needs.backend.outputs.orders-api-fingerprint }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.webapp-url }} |"
            echo ""
            echo "The next Azure environment snapshot should show this fingerprint running."
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------- 11. Report the environments, again
  snapshot-after-production:
    name: Report the environments (after production)
    needs: deploy
    uses: ./.github/workflows/snapshot-azure-environment.yml
    secrets: inherit
