name: CI build

# The pipeline for the whole order system: the Java backend and both mobile apps, built,
# controlled and released together from one commit on main.
#
#   build-and-attest  build, scan and attest every control to Kosli
#   publish-gate      may this component be published?
#   release-gate      waits for approval, then asks Kosli whether the release may go out
#   deploy            put the approved build on Azure App Service
#
# Two of the steps are manual, and neither of them is the decision:
#
#   1. run "Report integration test result" for this commit, choosing pass or fail
#   2. approve the release-gate job ("continue")
#
# The approval only lets the gate job run, and the job asks Kosli. A human can start the
# gate; a human cannot talk it into passing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mutation_threshold:
        description: "Mutation score threshold, in percent"
        type: string
        default: "85"

permissions:
  contents: read
  pull-requests: read

env:
  KOSLI_ORG: kosli-public
  KOSLI_FLOW: order-system-ci
  # The trail is the commit, so the manually-run integration test workflow can find it.
  KOSLI_TRAIL: ${{ github.sha }}
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
  KOSLI_DRY_RUN: ${{ vars.KOSLI_DRY_RUN }}
  ARTIFACT_NAME: orders-api
  MUTATION_THRESHOLD: ${{ github.event.inputs.mutation_threshold || vars.MUTATION_THRESHOLD || '85' }}

jobs:
  build-and-attest:
    name: Build and attest
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.artifact.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      # ---------------------------------------------------------------- Kosli flow + trail
      # The flow template is version-controlled with the code
      # (kosli/flow-templates/order-system-ci.yml), so the system's definition of "done"
      # changes through pull requests like anything else.
      - name: Create or update the Kosli flow
        run: |
          kosli create flow "$KOSLI_FLOW" \
            --template-file kosli/flow-templates/order-system-ci.yml \
            --description "The order system: Java backend on Azure App Service, plus the Mobile Orders apps"

      - name: Begin the Kosli trail for this commit
        run: |
          kosli begin trail "$KOSLI_TRAIL" \
            --description "$(git log -1 --pretty=%s)"

      # -------------------------------------------------------------------- 1. Peer review
      - name: Attest the pull request
        run: |
          kosli attest pullrequest github \
            --name pull-request \
            --github-token "${{ secrets.GITHUB_TOKEN }}"

      # ---------------------------------------------------------------- Build and unit test
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Stage the deployable
        run: |
          mkdir -p deploy
          # App Service's Java SE container runs /home/site/wwwroot/app.jar
          cp target/orders-api.jar deploy/app.jar

      # ------------------------------------------------------------- Artifact + provenance
      - name: Attest the backend
        id: artifact
        run: |
          FINGERPRINT="$(kosli fingerprint deploy --artifact-type dir)"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          # Every later attestation binds to this artifact via KOSLI_FINGERPRINT.
          echo "KOSLI_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
          kosli attest artifact deploy \
            --artifact-type dir \
            --name "$ARTIFACT_NAME"
          {
            echo "### Kosli"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trail | [\`$KOSLI_TRAIL\`](https://app.kosli.com/$KOSLI_ORG/flows/$KOSLI_FLOW/trails/$KOSLI_TRAIL) |"
            echo "| Artifact | \`$ARTIFACT_NAME\` |"
            echo "| Fingerprint | \`$FINGERPRINT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the peer review evaluation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/peer_review_attestation.py \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --out peer-review.json
          kosli attest custom \
            --name "$ARTIFACT_NAME.peer-review" \
            --type peer-review \
            --attestation-data peer-review.json

      - name: Attest the unit tests
        run: |
          kosli attest junit \
            --name "$ARTIFACT_NAME.unit-tests" \
            --results-dir target/surefire-reports

      # ------------------------------------------------------------ 2. SonarQube quality gate
      # No `kosli attest` call here: the org's Sonar integration (Kosli Docs > Integrations >
      # Sonar) has a webhook configured on the SonarCloud project, so SonarCloud attests the
      # quality gate result straight to this trail once the scan below completes. The
      # sonar.analysis.kosli_* args are what tell it which flow/trail/artifact to attest to.
      - name: Run the SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.analysis.kosli_flow=${{ env.KOSLI_FLOW }}
            -Dsonar.analysis.kosli_trail=${{ env.KOSLI_TRAIL }}
            -Dsonar.analysis.kosli_attestation=sonar-quality-gate
            -Dsonar.analysis.kosli_git_commit=${{ github.sha }}
            -Dsonar.analysis.kosli_artifact_fingerprint=${{ env.KOSLI_FINGERPRINT }}

      # ----------------------------------------------------------------- 3. Mutation testing
      - name: Run mutation testing
        run: mvn -B --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Attest the mutation testing results
        run: |
          python3 scripts/mutation_attestation.py \
            --report target/pit-reports/mutations.xml \
            --threshold "$MUTATION_THRESHOLD" \
            --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out mutation-testing.json
          kosli attest custom \
            --name "$ARTIFACT_NAME.mutation-tests" \
            --type mutation-testing \
            --attestation-data mutation-testing.json \
            --attachments target/pit-reports

      # ------------------------------------------------------------------- 4. The mobile apps
      - name: Build the mobile apps
        run: |
          make package PLATFORM=android
          make package PLATFORM=ios

      - name: Attest the mobile apps
        run: |
          for platform in android ios; do
            kosli attest artifact "build/mobileorders-${platform}.zip" \
              --artifact-type file \
              --name "mobileorders-${platform}"
          done

      - name: Scan the mobile apps
        run: |
          make scan PLATFORM=android
          make scan PLATFORM=ios

      - name: Attest the mobile scans
        run: |
          for platform in android ios; do
            kosli attest custom "build/mobileorders-${platform}.zip" \
              --artifact-type file \
              --name mobile-sast \
              --type mobile-sast \
              --attestation-data "build/mobsfscan-${platform}.sarif" \
              --attachments "build/mobsfscan-${platform}.sarif"
          done

      - name: Upload the deployable
        uses: actions/upload-artifact@v7
        with:
          name: orders-api-jar
          path: deploy/app.jar
          if-no-files-found: error

      - name: What happens next
        run: |
          {
            echo "### Next"
            echo ""
            echo "The trail is not compliant yet: nothing has reported an integration test run."
            echo ""
            echo "1. Run the **Report integration test result** workflow with commit"
            echo "   \`$KOSLI_TRAIL\`, choosing \`pass\` or \`fail\`."
            echo "2. Approve **release-gate** below. Kosli decides from there."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------- 5. Publish gate
  publish-gate:
    name: May this component be published?
    runs-on: ubuntu-latest
    needs: build-and-attest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      # The policy is kosli/policies/publish-gate.yml, created by the "Bootstrap Kosli"
      # workflow. It judges the backend's own controls only, so it can run before the
      # integration test and the approval exist.
      - name: Assert the publish-gate policy
        run: |
          kosli assert artifact \
            --fingerprint "${{ needs.build-and-attest.outputs.fingerprint }}" \
            --policy publish-gate \
            --flow "$KOSLI_FLOW"

      - name: Explain how to unblock
        if: failure()
        run: |
          cat <<EOF
          ==========================================================================
          The publish gate blocked this component.

          Trail:  https://app.kosli.com/${KOSLI_ORG}/flows/${KOSLI_FLOW}/trails/${KOSLI_TRAIL}
          Policy: kosli/policies/publish-gate.yml

          Either fix the failing control, or waive it with a recorded reason:

            scripts/waive_attestation.sh \\
              --trail "${KOSLI_TRAIL}" \\
              --fingerprint "${{ needs.build-and-attest.outputs.fingerprint }}" \\
              --reason "why this is acceptable, and what happens next"

          ...then re-run this job. The Sonar attestation arrives by webhook, so it can also
          simply not have landed yet.
          ==========================================================================
          EOF

  # ------------------------------------------------------------------------- 6. Release gate
  release-gate:
    name: May this release go out?
    runs-on: ubuntu-latest
    needs: [build-and-attest, publish-gate]
    # Without required reviewers on this environment the job does not wait, and there is
    # no approval to attest below.
    environment: production-release
    # actions: read is for the approvals API, which is how the approver is identified.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      - name: Who approved this release?
        id: approver
        uses: ./.github/actions/get-github-workflow-approver
        with:
          environment-name: production-release

      # Before the assert below: the flow template requires this attestation.
      - name: Attest the approval
        run: |
          kosli attest custom \
            --name release-approval \
            --type approval-github-workflow \
            --attestation-data "${{ steps.approver.outputs.approval-json-file }}" \
            --attachments "${{ steps.approver.outputs.approval-json-file }}"
          echo "Approved by ${{ steps.approver.outputs.approver }}" >> "$GITHUB_STEP_SUMMARY"

      # The policy is kosli/policies/release-gate.yml. It requires the whole trail to be
      # compliant, so a missing or failing integration test blocks here - as does an
      # unscanned mobile app or a still-failing backend control.
      - name: Assert the release-gate policy
        run: |
          kosli assert artifact \
            --fingerprint "${{ needs.build-and-attest.outputs.fingerprint }}" \
            --policy release-gate \
            --flow "$KOSLI_FLOW"

      - name: Explain how to unblock
        if: failure()
        run: |
          cat <<EOF
          ==========================================================================
          The release gate blocked ${KOSLI_TRAIL}.

          Trail:  https://app.kosli.com/${KOSLI_ORG}/flows/${KOSLI_FLOW}/trails/${KOSLI_TRAIL}
          Policy: kosli/policies/release-gate.yml

          The usual cause in this demo is the integration test run: either it was never
          reported to this trail, or it was reported as a failing run. The approval itself
          was recorded a step earlier, as ${{ steps.approver.outputs.approver }}.

          Run the "Report integration test result" workflow with:

            commit: ${KOSLI_TRAIL}
            result: pass

          ...then re-run this job. Reporting again adds another attestation to the trail;
          Kosli judges the latest one.
          ==========================================================================
          EOF

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [build-and-attest, release-gate]
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      # The same build the gate approved, byte for byte - not a rebuild.
      - uses: actions/download-artifact@v7
        with:
          name: orders-api-jar
          path: deploy

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deploy

      - name: Smoke test
        run: |
          URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL"; then
              echo
              echo "orders-api is up"
              exit 0
            fi
            echo "waiting for the app to start (attempt $attempt)..."
            sleep 10
          done
          echo "app did not become healthy" >&2
          exit 1

      - name: Where it landed
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$KOSLI_TRAIL\` |"
            echo "| Backend fingerprint | \`${{ needs.build-and-attest.outputs.fingerprint }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.webapp-url }} |"
            echo ""
            echo "The next Azure environment snapshot should show this fingerprint running."
          } >> "$GITHUB_STEP_SUMMARY"
