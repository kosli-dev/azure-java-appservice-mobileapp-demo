name: Bootstrap Kosli

# Creates (or updates) the org-level Kosli objects the pipeline depends on:
#   * the custom attestation types, including the jq rules that decide compliance
#   * the release-gate policy that the CI/CD pipeline asserts against
#
# Run it once before the first pipeline run, and again after editing anything under kosli/.
# It is idempotent: Kosli versions the changed objects instead of duplicating them.

on:
  workflow_dispatch:
    inputs:
      create_environment:
        description: "Also create the Azure environments and attach the deploy-gate policy to production"
        type: boolean
        default: true

permissions:
  contents: read

env:
  KOSLI_ORG: kosli-public
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: "2"

      - name: Create attestation types and the release-gate policy
        run: ./scripts/bootstrap_kosli.sh

      # One Kosli environment per Azure resource group, since that is the granularity
      # `kosli snapshot azure` reports at. Both carry `secure-development` - the build-time
      # controls, which exist by the time a build reaches staging. Only production also carries
      # `production-readiness`, whose two controls arrive after the build; requiring those in
      # staging would make it permanently non-compliant.
      - name: Create the Azure environments and attach their policies
        if: ${{ inputs.create_environment }}
        env:
          KOSLI_ENVIRONMENT: ${{ vars.KOSLI_ENVIRONMENT || 'azure-appservice-prod' }}
          KOSLI_ENVIRONMENT_STAGING: ${{ vars.KOSLI_ENVIRONMENT_STAGING || 'azure-appservice-staging' }}
        run: |
          kosli create environment "$KOSLI_ENVIRONMENT" \
            --type azure-apps \
            --description "Azure App Service running orders-api in production"
          kosli create environment "$KOSLI_ENVIRONMENT_STAGING" \
            --type azure-apps \
            --description "Azure App Service running orders-api in staging"
          kosli create policy secure-development kosli/policies/secure-development.yml \
            --type env \
            --description "What an artifact must have gone through to run in any environment"
          kosli create policy production-readiness kosli/policies/production-readiness.yml \
            --type env \
            --description "What production requires on top of secure-development"
          kosli attach-policy secure-development --environment "$KOSLI_ENVIRONMENT"
          kosli attach-policy secure-development --environment "$KOSLI_ENVIRONMENT_STAGING"
          kosli attach-policy production-readiness --environment "$KOSLI_ENVIRONMENT"

      - name: Show what exists now
        run: |
          echo "### Attestation types" >> "$GITHUB_STEP_SUMMARY"
          kosli list attestation-types --output table >> "$GITHUB_STEP_SUMMARY" || true
          echo "### Policies" >> "$GITHUB_STEP_SUMMARY"
          kosli list policies --output table >> "$GITHUB_STEP_SUMMARY" || true
