# Read by the sonar-scanner CLI (SonarSource/sonarqube-scan-action in
# .github/workflows/ci-cd.yml). The kosli_* analysis parameters that make the scan attest
# straight to Kosli via the org's Sonar webhook are passed as scanner args in the workflow,
# not here, since they change per run (flow/trail/fingerprint) while this file describes the
# project itself.
sonar.projectKey=kosli-dev_azure-java-appservice-demo
sonar.organization=kosli-dev

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
