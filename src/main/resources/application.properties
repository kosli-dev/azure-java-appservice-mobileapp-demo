spring.application.name=orders-api

# Azure App Service maps public traffic to the container port declared by WEBSITES_PORT.
# Locally (and in CI) we default to 8080.
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Populated at build time by CI so /api/version can be traced back to a Kosli trail.
app.commit-sha=${COMMIT_SHA:unknown}
