# yaml-language-server: $schema=https://docs.kosli.com/schemas/policy/v1.json
#
# Secure development: what any artifact must have gone through to run in any of the demo's
# Azure environments, staging and production alike.
#
#   kosli create policy secure-development kosli/policies/secure-development.yml --type env
#   kosli attach-policy secure-development --environment azure-appservice-staging
#   kosli attach-policy secure-development --environment azure-appservice-prod
#
# It is the publish gate's control set: known provenance, a compliant trail, and the four
# controls the build itself produces - which is everything that exists by the time a build
# reaches staging. The two controls that arrive later - the integration test run and the
# release approval - are production's business and live in production-readiness.yml.
# Requiring them here would make staging permanently non-compliant, since a build lands on
# staging minutes before either can exist.
_schema: https://docs.kosli.com/schemas/policy/v1

artifacts:
  provenance:
    required: true
  trail-compliance:
    required: true
  # trail-compliance: required: true already covers every attestation the flow template
  # demands, trail-level or not - including the trail's `pull-request` attestation and
  # peer-review-decision - so nothing below is strictly load-bearing. Named explicitly anyway,
  # so the policy itself documents what a compliant artifact went through rather than relying
  # entirely on the template being read alongside it.
  attestations:
    - name: unit-tests
      type: junit
    - name: sonar-quality-gate
      type: sonar
    - name: mutation-tests
      type: custom:mutation-testing
    - name: sbom
      type: custom:cyclonedx-sbom
    # peer-review-decision is trail-level, not artifact-bound - matched here by `for_control`
    # rather than by artifact binding, which is what that field is for on a `decision`-type
    # rule (per the published policy schema).
    - type: decision
      for_control: peer-review
