# yaml-language-server: $schema=https://docs.kosli.com/schemas/policy/v1.json
#
# "May this component be published?"
#
# Created/updated with:
#   kosli create policy publish-gate kosli/policies/publish-gate.yml --type env \
#     --description "Controls a component must satisfy before it is published"
#
# Enforced in CI with:
#   kosli assert artifact --fingerprint "$FINGERPRINT" --policy publish-gate --flow orders-api-ci
#
# Exit code 0 = may be published. Non-zero = blocked, with the failing controls printed.
_schema: https://docs.kosli.com/schemas/policy/v1

artifacts:
  # The binary must be one Kosli has seen being built, by a pipeline, from a known commit.
  provenance:
    required: true

  # Everything the flow template asks for must be present and compliant.
  trail-compliance:
    required: true

  # The individual controls, spelled out. Listing them here (as well as relying on
  # trail-compliance above) keeps the policy readable as a control statement and lets the
  # same policy be reused by components whose flow templates differ.
  attestations:
    - name: peer-review
      type: custom:peer-review

    - name: unit-tests
      type: junit

    - name: sonar-quality-gate
      type: custom:sonarqube-quality-gate

    - name: mutation-tests
      type: custom:mutation-testing
