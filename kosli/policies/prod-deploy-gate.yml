# yaml-language-server: $schema=https://docs.kosli.com/schemas/policy/v1.json
#
# Groundwork for the deployment gate (point 4 of the customer's demo scenario).
#
# Attach it to the Azure environment so Kosli continuously flags anything running in
# App Service that did not clear the same controls:
#
#   kosli create policy prod-deploy-gate kosli/policies/prod-deploy-gate.yml --type env
#   kosli attach-policy prod-deploy-gate --environment azure-appservice-prod
#
# It is the release gate's control set, so what runs in production is judged by the same bar
# the pipeline used to let it out - including the integration test run and the approval.
_schema: https://docs.kosli.com/schemas/policy/v1

artifacts:
  provenance:
    required: true
  trail-compliance:
    required: true
  attestations:
    - name: peer-review
      type: custom:peer-review
    - name: unit-tests
      type: junit
    - name: sonar-quality-gate
      type: sonar
    - name: mutation-tests
      type: custom:mutation-testing
    - name: integration-tests
      type: custom:integration-test
    - name: release-approval
      type: custom:approval-github-workflow
