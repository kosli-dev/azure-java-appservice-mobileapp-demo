# yaml-language-server: $schema=https://docs.kosli.com/schemas/policy/v1.json
#
# "May this release go out?"
#
# Created/updated with:
#   kosli create policy release-gate kosli/policies/release-gate.yml --type env \
#     --description "Controls a release of the order system must satisfy"
#
# Enforced in CI with:
#   kosli assert artifact --fingerprint "$FINGERPRINT" --policy release-gate --flow order-system-ci
#
# It runs *after* the manual approval on the pipeline, so pressing "continue" is not the
# authority: the integration test run has to have been reported to the trail, and judged
# compliant by the jq rules on the `integration-test` type, or this fails.
#
# `trail-compliance` covers the build's own controls, from order-system-ci.yml. The two
# release controls are listed below instead: they are attested after the build, so the
# template cannot require them without making the component non-compliant at publish-gate
# time. This policy is where they are enforced.
_schema: https://docs.kosli.com/schemas/policy/v1

artifacts:
  # The release contents must be binaries Kosli saw being built, by a pipeline, from a
  # known commit.
  provenance:
    required: true

  # Everything order-system-ci.yml asks for: the backend's controls and both mobile scans.
  trail-compliance:
    required: true

  # The release controls. Both are attested against this artifact's fingerprint, not the
  # trail, so that these rules match them.
  attestations:
    - name: integration-tests
      type: custom:integration-test

    - name: release-approval
      type: custom:approval-github-workflow
