# Kosli flow template for the orders-api component.
#
# The template is the component's definition of "done": Kosli marks the artifact compliant
# only when every attestation listed here has been made AND is itself compliant.
#
# Applied by CI with:
#   kosli create flow orders-api-ci --template-file kosli/flow-template.yml
version: 1
trail:
  attestations:
    # Raw pull-request evidence for the merge commit (who opened it, who reviewed it, when).
    - name: pull-request
      type: pull_request
  artifacts:
    - name: orders-api
      attestations:
        # Peer review control: evaluated by the jq rules on the `peer-review` type.
        - name: peer-review
          type: custom:peer-review
        - name: unit-tests
          type: junit
        # SonarQube quality gate, attested straight from SonarCloud via its Kosli webhook.
        - name: sonar-quality-gate
          type: sonar
        # Mutation testing (PIT). Fails below threshold in this demo - that is what the
        # waiver step is for.
        - name: mutation-tests
          type: custom:mutation-testing
