# yaml-language-server: $schema=https://docs.kosli.com/schemas/flow-template/v1.json
#
# Kosli flow template for the order system: the Java backend and both mobile apps, built,
# controlled and released together from one pipeline.
#
# A trail is a commit on main. It is compliant only once every control below has been
# attested and is itself compliant, which is what the release gate asserts.
#
# Applied by CI with:
#   kosli create flow order-system-ci --template-file kosli/flow-templates/order-system-ci.yml
version: 1
trail:
  attestations:
    # Raw pull-request evidence for the merge commit (who opened it, who reviewed it, when).
    - name: pull-request
      type: pull_request
    # Reported after the build, by the "Report integration test result" workflow.
    - name: integration-tests
      type: custom:integration-test
    # Who pressed "Approve" on the environment the release gate waits on.
    - name: release-approval
      type: custom:approval-github-workflow
  artifacts:
    - name: orders-api
      attestations:
        # TEMP-BYPASS-PEER-REVIEW - revert this block, and the two others with the same
        # marker, to put the peer review control back.
        # Peer review control: evaluated by the jq rules on the `peer-review` type.
        # - name: peer-review
        #   type: custom:peer-review
        - name: unit-tests
          type: junit
        # SonarQube quality gate, attested straight from SonarCloud via its Kosli webhook.
        - name: sonar-quality-gate
          type: sonar
        # Mutation testing (PIT). Fails below threshold in this demo - that is what the
        # waiver step is for.
        - name: mutation-tests
          type: custom:mutation-testing
    # Per-artifact, not per-trail: the scan describes one app.
    - name: mobileorders-android
      attestations:
        - name: mobile-sast
          type: custom:mobile-sast
    - name: mobileorders-ios
      attestations:
        - name: mobile-sast
          type: custom:mobile-sast
