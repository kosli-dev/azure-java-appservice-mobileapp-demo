# yaml-language-server: $schema=https://docs.kosli.com/schemas/flow-template/v1.json
#
# Kosli flow template for the order system: the Java backend and both mobile apps, built,
# controlled and released together from one pipeline.
#
# A trail is a commit on main. Everything here is produced by the build itself, so the trail
# is compliant as soon as the build has run - the publish gate judges the artifact against
# this template while the build is still the only thing that has happened.
#
# The release controls - the integration test run and the approval - are deliberately NOT
# here. They are attested after the build, so requiring them in the template would make the
# component non-compliant at publish-gate time. They live in kosli/policies/release-gate.yml
# and kosli/policies/prod-deploy-gate.yml instead.
#
# Applied by CI with:
#   kosli create flow order-system-ci --template-file kosli/flow-templates/order-system-ci.yml
version: 1
trail:
  attestations:
    # Raw pull-request evidence for the merge commit (who opened it, who reviewed it, when).
    - name: pull-request
      type: pull_request
  artifacts:
    - name: orders-api
      attestations:
        # Raw peer-review evidence - no compliance-deciding jq rules on this type any more.
        - name: peer-review
          type: custom:peer-review
        # The peer-review control decision: kosli/policies/peer-review.rego evaluated against
        # the evidence above, recorded with `kosli attest decision --control peer-review`.
        # Unlike integration-tests/release-approval, this is produced in the same job as the
        # evidence it judges, so it belongs here rather than in release-gate.yml - a bad peer
        # review fails the trail (and so publish-gate) as soon as the build finishes.
        - name: peer-review-decision
          type: decision
        - name: unit-tests
          type: junit
        # SonarQube quality gate, attested straight from SonarCloud via its Kosli webhook.
        - name: sonar-quality-gate
          type: sonar
        # Mutation testing (PIT). Fails below threshold in this demo - that is what the
        # waiver step is for.
        - name: mutation-tests
          type: custom:mutation-testing
    # Per-artifact, not per-trail: the scan describes one app.
    - name: mobileorders-android
      attestations:
        - name: oversecured
          type: custom:oversecured
    - name: mobileorders-ios
      attestations:
        - name: oversecured
          type: custom:oversecured
